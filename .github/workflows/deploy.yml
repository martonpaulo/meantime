name: Deploy

on:
  # Deploy never revalidates: it waits for Validate to pass on main and publishes
  # the exact commit Validate checked (fleet convention, skill-deck #263).
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # The deployed commit, which the deploy job's last step reads back from the live site.
      # The deploy publishes a staged copy, so nothing it writes is ever committed.
      - name: Stage the site
        run: cp -R site "$RUNNER_TEMP/site"
      - name: Record the deployed commit
        run: git rev-parse HEAD > "$RUNNER_TEMP/site/build.txt"
      # Last step on the staged copy: every local asset address gets ?v=<md5>, so a browser never
      # pairs new HTML with a cached old stylesheet, script or image.
      - name: Version the asset addresses
        run: bash scripts/version-site-assets.sh --site "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Check out the read-back check
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/live_build_check.py
          sparse-checkout-cone-mode: false

      # A green upload is not what the site serves: read the commit back, with a query no cache has seen.
      - name: Read the live site back
        run: python3 scripts/live_build_check.py https://meantime.martonpaulo.com/build.txt "${{ github.event.workflow_run.head_sha || github.sha }}" --timeout 300
