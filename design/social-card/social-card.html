<!doctype html>
<!-- Meantime social card. Source of truth for docs/social-card.png, served at
     https://meantime.martonpaulo.com/social-card.png (1200x630). Never edit the PNG.
     Render with `make social-card` (Playwright screenshot, then an 8-bit PNG).
     Layout, safe area and rules: the social card standard (skill-deck#261). Fonts: Inter, OFL (fonts/OFL.txt). -->
<meta charset="utf-8">
<style>
  @font-face { font-family: "Inter Display"; font-weight: 700; src: url(fonts/Inter_28pt-Bold.ttf); }
  @font-face { font-family: "Inter"; font-weight: 400; src: url(fonts/Inter_18pt-Regular.ttf); }
  @font-face { font-family: "Inter"; font-weight: 500; src: url(fonts/Inter_24pt-Medium.ttf); }
  @font-face { font-family: "Inter"; font-weight: 600; src: url(fonts/Inter_24pt-SemiBold.ttf); }
  html, body { margin: 0; }
  .card {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    background:
      radial-gradient(760px 560px at 80% 45%, rgba(47, 99, 231, .26), transparent 64%),
      radial-gradient(600px 380px at 0% 100%, rgba(47, 99, 231, .10), transparent 70%),
      linear-gradient(160deg, #f9fbff 0%, #e8eefc 100%);
    color: #111a33; font-family: "Inter", sans-serif;
  }
  .copy { position: absolute; left: 96px; top: 50%; transform: translateY(-54%); width: 480px; }
  .icon { width: 104px; height: 104px; display: block; margin-bottom: 30px;
          filter: drop-shadow(0 16px 28px rgba(47, 99, 231, .30)); }
  .eyebrow { margin: 0 0 18px; font-weight: 600; font-size: 22px; letter-spacing: .12em;
             text-transform: uppercase; color: #2352c9; }
  h1 { margin: 0; font: 700 84px/1 "Inter Display", sans-serif; letter-spacing: -0.035em; }
  .promise { margin: 22px 0 0; font-weight: 500; font-size: 38px; line-height: 1.18;
             letter-spacing: -0.015em; color: #3a4666; text-wrap: balance; }
  .domain { position: absolute; left: 96px; bottom: 62px; font-size: 24px; color: #6b7593; }
  .shot { position: absolute; left: 690px; top: 70px; width: 470px;
          filter: drop-shadow(0 30px 50px rgba(20, 40, 100, .22)); }
</style>
<div class="card">
  <div class="copy">
    <img class="icon" src="../../docs/assets/app-icon.png" alt="">
    <p class="eyebrow">Free for Mac · Open source</p>
    <h1>Meantime</h1>
    <p class="promise">World clocks in your menu bar</p>
  </div>
  <img class="shot" src="../../docs/screenshots/panel.webp" alt="">
  <div class="domain">meantime.martonpaulo.com</div>
</div>
